name: Deploy Front to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'galerie-front/**'
      - '.github/workflows/deploy-front.yml'
  workflow_run:
    workflows: ["Deploy CMS to Clever Cloud"]
    types: [completed]
    branches: [master]
  repository_dispatch:
    types: [strapi-content-update]
  # Rebuild quotidien (00h10 à Paris en hiver) : le statut des expositions est calculé au build.
  schedule:
    - cron: '10 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          cache-dependency-path: galerie-front/yarn.lock

      # Cache des images optimisées par astro:assets : évite de tout régénérer à chaque build
      # (rebuild quotidien, mises à jour CMS).
      - uses: actions/cache@v4
        with:
          path: galerie-front/node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('galerie-front/yarn.lock') }}-${{ github.run_id }}
          restore-keys: |
            astro-assets-${{ runner.os }}-${{ hashFiles('galerie-front/yarn.lock') }}-

      - name: Install & build
        working-directory: galerie-front
        env:
          STRAPI_API_URL: ${{ secrets.STRAPI_API_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
          PUBLIC_STRAPI_API_URL: ${{ secrets.STRAPI_API_URL }}
          SITE_URL: https://www.galerielouisbarrand.fr
        run: |
          yarn install --frozen-lockfile
          yarn test
          yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: galerie-front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
